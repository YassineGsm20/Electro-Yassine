<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electro Yassine</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fa;
    color:#111827;
}
header{
    background:#111827;
    color:white;
    padding:17px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#00c853;
}

.cart-button{
    background:#00c853;
    border:none;
    color:white;
    padding:11px 17px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
.hero{
    background:linear-gradient(135deg, #111827, #1f2937);
    color:white;
    text-align:center;
    padding:70px 20px;
}

.hero h1{
    font-size:45px;
    margin-bottom:12px;
}

.hero p{
    color:#d1d5db;
    font-size:18px;
}
.search{
    text-align:center;
    padding:25px;
}

.search input{
    width:90%;
    max-width:600px;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

.products-section{
    padding:20px 7% 70px;
}

.products-section h2{
    margin-bottom:25px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:25px;
}

.product{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.product img{
    width:100%;
    height:210px;
    object-fit:cover;
}

.product-info{
    padding:18px;
}

.product-info h3{
    margin-bottom:10px;
}

.price{
    color:#00a843;
    font-size:21px;
    font-weight:bold;
    margin-bottom:15px;
}

.add{
    width:100%;
    border:none;
    background:#111827;
    color:white;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
}

.add:hover{
    background:#00c853;
}
.cart{
    position:fixed;
    top:0;
    right:-450px;
    width:430px;
    max-width:100%;
    height:100vh;
    background:white;
    z-index:1000;
    padding:25px;
    overflow-y:auto;
    box-shadow:-5px 0 20px rgba(0,0,0,.2);
    transition:.4s;
}

.cart.open{
    right:0;
}

.cart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    background:#ef4444;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

.cart-item{
    display:flex;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid #ddd;
}

.cart-item img{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:8px;
}

.cart-info{
    flex:1;
}

.quantity{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:8px;
}

.quantity button{
    width:28px;
    height:28px;
    border:none;
    background:#111827;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

.delete{
    background:#ef4444 !important;
}

.totals{
    margin-top:25px;
    line-height:2;
}

.totals div{
    display:flex;
    justify-content:space-between;
}

.total{
    font-size:22px;
    font-weight:bold;
}
.checkout{
    margin-top:25px;
}

.checkout h3{
    margin-bottom:15px;
}

.checkout input,
.checkout select,
.checkout textarea{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

.checkout textarea{
    min-height:80px;
}

.whatsapp{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#25D366;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}
.admin-link{
    text-align:center;
    padding:20px;
}

.admin-link button{
    background:#111827;
    color:white;
    border:none;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
}
footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px;
}

@media(max-width:600px){
    .hero h1{
        font-size:32px;
    }
    header{
        padding:15px;
    }
    .products-section{
        padding-left:15px;
        padding-right:15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        Electro <span>Yassine</span>
    </div>
    <button class="cart-button" onclick="openCart()">
        🛒 Panier (<span id="cartCount">0</span>)
    </button>
</header>

<section class="hero">
    <h1>Electro Yassine</h1>
    <p>Votre boutique électronique à Riad Oulfa</p>
</section>

<div class="search">
    <input id="search" type="text" placeholder="🔎 Rechercher un produit..." oninput="searchProducts()">
</div>

<section class="products-section">
    <h2>🛍️ Nos produits</h2>
    <div id="products" class="products"></div>
</section>

<div id="cart" class="cart">
    <div class="cart-header">
        <h2>🛒 Mon panier</h2>
        <button class="close" onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="totals">
        <div>
            <span>Sous-total</span>
            <strong><span id="subtotal">0</span> DH</strong>
        </div>
        <div>
            <span>Livraison</span>
            <strong><span id="deliveryPrice">0</span> DH</strong>
        </div>
        <hr>
        <div class="total">
            <span>TOTAL</span>
            <strong><span id="total">0</span> DH</strong>
        </div>
    </div>

    <div class="checkout">
        <h3>📦 Informations</h3>
        <input id="customerName" type="text" placeholder="Nom complet">
        <input id="customerPhone" type="tel" placeholder="Téléphone">
        <select id="delivery" onchange="updateCart()">
            <option value="store">🏪 Retrait magasin - Riad Oulfa (0 DH)</option>
            <option value="delivery">🚚 Livraison Casablanca (15 DH)</option>
        </select>
        <textarea id="address" placeholder="Adresse de livraison"></textarea>
        <button class="whatsapp" onclick="sendOrder()">📱 Commander sur WhatsApp</button>
    </div>
</div>

<div class="admin-link">
    <button onclick="openAdmin()">⚙️ Espace vendeur</button>
</div>

<footer>
    <p>© 2026 Electro Yassine</p>
    <br>
    <p>📍 Riad Oulfa, Casablanca</p>
</footer>

<!-- مكتبة Supabase -->
<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const supabaseUrl = 'https://nvimuhzejyauoriupkot.supabase.co';
    const supabaseKey = 'sb_publishable_27i9MDfLKt8i-lWiiROvDA_CfF_yRvS';
    const supabase = createClient(supabaseUrl, supabaseKey);

    let products = [];
    let cart = [];

    async function fetchProducts() {
        const { data, error } = await supabase.from('products').select('*');
        if (error) {
            console.error('Erreur lors du chargement des produits:', error);
            products = [];
        } else {
            // On attribue un identifiant unique (index) basé sur la position dans la liste
            products = (data || []).map((p, index) => ({
                uniqueId: "prod_" + index,
                name: p.title,
                price: p.price,
                image: p.Image
            }));
        }
        displayProducts(products);
    }

    window.displayProducts = function(list){
        const container = document.getElementById("products");
        container.innerHTML = "";

        if(!list || list.length === 0){
            container.innerHTML = `
                <div style="text-align:center; padding:50px; width:100%; grid-column:1/-1;">
                    <h3>📦 Aucun produit disponible</h3>
                    <p style="margin-top:10px;color:#777">Ajoutez des produits depuis l'espace vendeur.</p>
                </div>
            `;
            return;
        }

        list.forEach(product => {
            container.innerHTML += `
                <div class="product">
                    <img src="${product.image}" alt="${escapeHTML(product.name)}">
                    <div class="product-info">
                        <h3>${escapeHTML(product.name)}</h3>
                        <div class="price">${product.price} DH</div>
                        <button class="add" onclick="window.addToCart('${product.uniqueId}')">🛒 Ajouter au panier</button>
                    </div>
                </div>
            `;
        });
    }

    function escapeHTML(text){
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    window.addToCart = function(uniqueId){
        const product = products.find(p => p.uniqueId === uniqueId);
        if(!product){
            alert("Produit introuvable.");
            return;
        }

        const existing = cart.find(p => p.uniqueId === uniqueId);
        if(existing){
            existing.quantity++;
        }else{
            cart.push({
                uniqueId: product.uniqueId,
                name: product.name,
                price: Number(product.price),
                image: product.image,
                quantity: 1
            });
        }

        updateCart();
        openCart();
    }

    window.changeQuantity = function(uniqueId, amount){
        const item = cart.find(p => p.uniqueId === uniqueId);
        if(!item) return;

        item.quantity += amount;
        if(item.quantity <= 0){
            cart = cart.filter(p => p.uniqueId !== uniqueId);
        }
        updateCart();
    }

    window.removeFromCart = function(uniqueId){
        cart = cart.filter(p => p.uniqueId !== uniqueId);
        updateCart();
    }

    window.updateCart = function(){
        const container = document.getElementById("cartItems");
        container.innerHTML = "";

        const count = cart.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById("cartCount").textContent = count;

        if(cart.length === 0){
            container.innerHTML = `<p style="text-align:center; padding:25px; color:#777;">Votre panier est vide 🛒</p>`;
        }

        cart.forEach(item => {
            container.innerHTML += `
                <div class="cart-item">
                    <img src="${item.image}">
                    <div class="cart-info">
                        <strong>${escapeHTML(item.name)}</strong>
                        <p>${item.price} DH</p>
                        <div class="quantity">
                            <button onclick="window.changeQuantity('${item.uniqueId}', -1)">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="window.changeQuantity('${item.uniqueId}', 1)">+</button>
                            <button class="delete" onclick="window.removeFromCart('${item.uniqueId}')">🗑</button>
                        </div>
                    </div>
                </div>
            `;
        });

        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const deliveryElement = document.getElementById("delivery");
        const deliveryPrice = (deliveryElement && deliveryElement.value === "delivery") ? 15 : 0;

        document.getElementById("subtotal").textContent = subtotal;
        document.getElementById("deliveryPrice").textContent = deliveryPrice;
        document.getElementById("total").textContent = subtotal + deliveryPrice;
    }

    window.openCart = function(){
        document.getElementById("cart").classList.add("open");
    }

    window.closeCart = function(){
        document.getElementById("cart").classList.remove("open");
    }

    window.searchProducts = function(){
        const text = document.getElementById("search").value.toLowerCase().trim();
        const result = products.filter(product => product.name.toLowerCase().includes(text));
        displayProducts(result);
    }

    window.sendOrder = function(){
        if(cart.length === 0){
            alert("🛒 Votre panier est vide.");
            return;
        }

        const name = document.getElementById("customerName").value.trim();
        const phone = document.getElementById("customerPhone").value.trim();
        const delivery = document.getElementById("delivery").value;
        const address = document.getElementById("address").value.trim();

        if(!name){ alert("Veuillez entrer votre nom."); return; }
        if(!phone){ alert("Veuillez entrer votre numéro de téléphone."); return; }
        if(delivery === "delivery" && !address){ alert("Veuillez entrer votre adresse."); return; }

        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const deliveryPrice = (delivery === "delivery") ? 15 : 0;
        const total = subtotal + deliveryPrice;

        let message = "🛒 *NOUVELLE COMMANDE*%0A%0A";
        message += "🏪 *Electro Yassine*%0A%0A";
        message += "👤 Nom : " + encodeURIComponent(name) + "%0A";
        message += "📞 Téléphone : " + encodeURIComponent(phone) + "%0A%0A";
        message += "📦 *Produits :*%0A";

        cart.forEach(item => {
            message += "• " + encodeURIComponent(item.name) + " x" + item.quantity + " = " + (item.price * item.quantity) + " DH%0A";
        });

        message += "%0A💰 Sous-total : " + subtotal + " DH%0A";
        message += "🚚 Livraison : " + deliveryPrice + " DH%0A";
        message += "💵 *TOTAL : " + total + " DH*%0A%0A";

        if(delivery === "delivery"){
            message += "🚚 Livraison Casablanca%0A";
            message += "📍 Adresse : " + encodeURIComponent(address) + "%0A";
        }else{
            message += "🏪 Retrait magasin%0A";
            message += "📍 Riad Oulfa, Casablanca%0A";
        }

        const whatsappNumber = "212601130999";
        window.open("https://wa.me/" + whatsappNumber + "?text=" + message, "_blank");

        cart = [];
        updateCart();
    }

    window.openAdmin = function(){
        const password = prompt("🔐 Mot de passe vendeur :");
        if(password === "Yassinegsm2026"){
            window.location.href = "admin.html";
        }else{
            alert("❌ Mot de passe incorrect.");
        }
    }

    fetchProducts();
</script>

</body>
</html>
