<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Electro Yassine</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#00c853;
}

header button{
    background:#2563eb;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:7px;
    cursor:pointer;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 20px;
}

.title{
    margin-bottom:25px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.stat{
    background:white;
    padding:22px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.stat h3{
    color:#6b7280;
    font-size:15px;
    margin-bottom:10px;
}

.stat p{
    font-size:28px;
    font-weight:bold;
}

.card{
    background:white;
    padding:25px;
    border-radius:14px;
    margin-bottom:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.card h2{
    margin-bottom:20px;
}

.form input{
    width:100%;
    padding:13px;
    margin:6px 0 12px;
    border:1px solid #ddd;
    border-radius:8px;
}

.preview{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:10px;
    margin:10px 0;
    display:none;
}

.save{
    background:#00c853;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
}

.cancel{
    background:#6b7280;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
}

.admin-product{
    display:flex;
    align-items:center;
    gap:15px;
    padding:15px 0;
    border-bottom:1px solid #ddd;
}

.admin-product img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
}

.product-info{
    flex:1;
}

.edit{
    background:#2563eb;
    color:white;
    border:none;
    padding:9px 12px;
    border-radius:7px;
    cursor:pointer;
}

.delete{
    background:#ef4444;
    color:white;
    border:none;
    padding:9px 12px;
    border-radius:7px;
    cursor:pointer;
}

.order{
    border:1px solid #ddd;
    border-radius:10px;
    padding:18px;
    margin-bottom:15px;
}

.order-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
}

.order-products{
    background:#f9fafb;
    padding:12px;
    border-radius:8px;
    margin:12px 0;
}

.status{
    padding:7px;
    border:none;
    border-radius:6px;
}

.order-buttons{
    margin-top:12px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.order-buttons button{
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

.done{
    background:#00c853;
    color:white;
}

.cancel-order{
    background:#ef4444;
    color:white;
}

.delete-order{
    background:#111827;
    color:white;
}

.empty{
    text-align:center;
    padding:25px;
    color:#6b7280;
}

@media(max-width:650px){

    .admin-product{
        align-items:flex-start;
        flex-wrap:wrap;
    }

    .order-header{
        flex-direction:column;
        gap:10px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        Electro <span>Yassine</span>
    </div>

    <button onclick="goStore()">
        🏪 Boutique
    </button>

</header>


<div class="container">

    <div class="title">

        <h1>⚙️ Tableau de bord vendeur</h1>

        <p>Gestion de Electro Yassine</p>

    </div>


    <!-- STATISTIQUES -->

    <div class="stats">

        <div class="stat">
            <h3>💰 Chiffre d'affaires</h3>
            <p>
                <span id="sales">0</span> DH
            </p>
        </div>

        <div class="stat">
            <h3>📦 Commandes</h3>
            <p id="ordersCount">0</p>
        </div>

        <div class="stat">
            <h3>🛒 Produits vendus</h3>
            <p id="productsSold">0</p>
        </div>

        <div class="stat">
            <h3>📦 Produits en boutique</h3>
            <p id="productsCount">0</p>
        </div>

    </div>


    <!-- AJOUT PRODUIT -->

    <div class="card form">

        <h2 id="formTitle">
            ➕ Ajouter un produit
        </h2>

        <input
            id="productName"
            type="text"
            placeholder="Nom du produit"
        >

        <input
            id="productPrice"
            type="number"
            placeholder="Prix en DH"
        >

        <input
            id="productImage"
            type="file"
            accept="image/*"
            onchange="previewImage()"
        >

        <img
            id="imagePreview"
            class="preview"
            alt="Aperçu"
        >

        <br>

        <button
            class="save"
            onclick="saveProduct()"
        >
            💾 Enregistrer
        </button>

        <button
            class="cancel"
            onclick="cancelEdit()"
        >
            Annuler
        </button>

    </div>


    <!-- PRODUITS -->

    <div class="card">

        <h2>📦 Gestion des produits</h2>

        <div id="productsList"></div>

    </div>


    <!-- COMMANDES -->

    <div class="card">

        <h2>📋 Commandes</h2>

        <div id="ordersList"></div>

    </div>

</div>


<script>

/* =====================================
   DONNÉES
===================================== */

let products =
    JSON.parse(
        localStorage.getItem("electroProducts")
    ) || [];

let orders =
    JSON.parse(
        localStorage.getItem("electroOrders")
    ) || [];

let editingId = null;

let selectedImage = null;


/* =====================================
   APERÇU DE LA PHOTO
===================================== */

function previewImage(){

    const file =
        document.getElementById(
            "productImage"
        ).files[0];

    if(!file){
        return;
    }

    selectedImage = file;

    const reader = new FileReader();

    reader.onload = function(e){

        const preview =
            document.getElementById(
                "imagePreview"
            );

        preview.src = e.target.result;

        preview.style.display = "block";
    };

    reader.readAsDataURL(file);
}


/* =====================================
   SAUVEGARDER LES PRODUITS
===================================== */

function saveProducts(){

    localStorage.setItem(
        "electroProducts",
        JSON.stringify(products)
    );

}


/* =====================================
   ENREGISTRER PRODUIT
===================================== */

function saveProduct(){

    const name =
        document.getElementById(
            "productName"
        ).value.trim();

    const price =
        Number(
            document.getElementById(
                "productPrice"
            ).value
        );

    const file =
        document.getElementById(
            "productImage"
        ).files[0];


    /* Vérification */

    if(!name){

        alert("❌ Entre le nom du produit.");

        return;
    }


    if(!price || price <= 0){

        alert("❌ Entre un prix valide.");

        return;
    }


    /*
       SI ON AJOUTE UN NOUVEAU PRODUIT,
       UNE IMAGE EST OBLIGATOIRE.
    */

    if(editingId === null && !file){

        alert("❌ Choisis une photo du produit.");

        return;
    }


    /*
       SI NOUVELLE IMAGE
       ON UTILISE FileReader
    */

    if(file){

        const reader = new FileReader();


        reader.onload = function(e){

            const imageData =
                e.target.result;


            createOrUpdateProduct(
                name,
                price,
                imageData
            );

        };


        reader.readAsDataURL(file);


    }else{

        /*
           MODIFICATION SANS CHANGER
           LA PHOTO
        */

        const oldProduct =
            products.find(
                p => p.id === editingId
            );


        createOrUpdateProduct(
            name,
            price,
            oldProduct.image
        );

    }

}


/* =====================================
   CRÉER / MODIFIER
===================================== */

function createOrUpdateProduct(
    name,
    price,
    image
){

    if(editingId !== null){

        const product =
            products.find(
                p => p.id === editingId
            );


        if(product){

            product.name = name;

            product.price = price;

            product.image = image;

        }


        alert(
            "✅ Produit modifié avec succès !"
        );

    }else{

        const newProduct = {

            id: Date.now(),

            name: name,

            price: price,

            image: image

        };


        products.push(newProduct);


        alert(
            "✅ Produit ajouté avec succès !"
        );

    }


    saveProducts();

    cancelEdit();

    displayProducts();

}


/* =====================================
   AFFICHER PRODUITS
===================================== */

function displayProducts(){

    const list =
        document.getElementById(
            "productsList"
        );

    list.innerHTML = "";


    document.getElementById(
        "productsCount"
    ).textContent =
        products.length;


    if(products.length === 0){

        list.innerHTML = `
            <div class="empty">
                Aucun produit pour le moment.
            </div>
        `;

        return;
    }


    products.forEach(product => {

        list.innerHTML += `

            <div class="admin-product">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

                <div class="product-info">

                    <strong>
                        ${product.name}
                    </strong>

                    <p>
                        ${product.price} DH
                    </p>

                </div>

                <button
                    class="edit"
                    onclick="editProduct(${product.id})"
                >
                    ✏️ Modifier
                </button>

                <button
                    class="delete"
                    onclick="deleteProduct(${product.id})"
                >
                    🗑️ Supprimer
                </button>

            </div>

        `;

    });

}


/* =====================================
   MODIFIER PRODUIT
===================================== */

function editProduct(id){

    const product =
        products.find(
            p => p.id === id
        );


    if(!product){
        return;
    }


    editingId = id;


    document.getElementById(
        "productName"
    ).value = product.name;


    document.getElementById(
        "productPrice"
    ).value = product.price;


    const preview =
        document.getElementById(
            "imagePreview"
        );


    preview.src = product.image;

    preview.style.display = "block";


    document.getElementById(
        "formTitle"
    ).textContent =
        "✏️ Modifier le produit";


    /*
       On vide le champ fichier.
       L'ancienne photo sera conservée
       si aucune nouvelle photo n'est choisie.
    */

    document.getElementById(
        "productImage"
    ).value = "";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================
   SUPPRIMER PRODUIT
===================================== */

function deleteProduct(id){

    if(
        !confirm(
            "Voulez-vous supprimer ce produit ?"
        )
    ){

        return;
    }


    products =
        products.filter(
            p => p.id !== id
        );


    saveProducts();

    displayProducts();

}


/* =====================================
   ANNULER
===================================== */

function cancelEdit(){

    editingId = null;

    selectedImage = null;


    document.getElementById(
        "productName"
    ).value = "";


    document.getElementById(
        "productPrice"
    ).value = "";


    document.getElementById(
        "productImage"
    ).value = "";


    document.getElementById(
        "imagePreview"
    ).style.display = "none";


    document.getElementById(
        "formTitle"
    ).textContent =
        "➕ Ajouter un produit";

}


/* =====================================
   COMMANDES
===================================== */

function displayOrders(){

    const list =
        document.getElementById(
            "ordersList"
        );

    list.innerHTML = "";


    if(orders.length === 0){

        list.innerHTML = `
            <div class="empty">
                Aucune commande pour le moment.
            </div>
        `;

        updateStats();

        return;
    }


    const sorted =
        [...orders].reverse();


    sorted.forEach(order => {

        let productsHTML = "";


        order.products.forEach(product => {

            productsHTML += `

                <div>
                    • ${product.name}
                    x${product.quantity}
                    =
                    ${product.price * product.quantity}
                    DH
                </div>

            `;

        });


        list.innerHTML += `

            <div class="order">

                <div class="order-header">

                    <div>

                        <strong>
                            Commande #${order.id}
                        </strong>

                        <br>

                        ${order.date}

                    </div>

                    <select
                        class="status"
                        onchange="
                            changeStatus(
                                ${order.id},
                                this.value
                            )
                        "
                    >

                        <option
                            ${order.status === "En attente" ? "selected" : ""}
                        >
                            En attente
                        </option>

                        <option
                            ${order.status === "Terminée" ? "selected" : ""}
                        >
                            Terminée
                        </option>

                        <option
                            ${order.status === "Annulée" ? "selected" : ""}
                        >
                            Annulée
                        </option>

                    </select>

                </div>


                <p>
                    👤
                    <strong>
                        ${order.customerName}
                    </strong>
                </p>


                <p>
                    📞 ${order.customerPhone}
                </p>


                <p>
                    🚚 ${order.delivery}
                </p>


                <p>
                    📍 ${order.address}
                </p>


                <div class="order-products">

                    <strong>
                        📦 Produits :
                    </strong>

                    <br><br>

                    ${productsHTML}

                </div>


                <p>
                    Sous-total :
                    ${order.subtotal} DH
                </p>


                <p>
                    Livraison :
                    ${order.deliveryPrice} DH
                </p>


                <h3>
                    💰 Total :
                    ${order.total} DH
                </h3>


                <div class="order-buttons">

                    <button
                        class="done"
                        onclick="
                            changeStatus(
                                ${order.id},
                                'Terminée'
                            )
                        "
                    >
                        ✅ Terminée
                    </button>


                    <button
                        class="cancel-order"
                        onclick="
                            changeStatus(
                                ${order.id},
                                'Annulée'
                            )
                        "
                    >
                        ❌ Annulée
                    </button>


                    <button
                        class="delete-order"
                        onclick="
                            deleteOrder(
                                ${order.id}
                            )
                        "
                    >
                        🗑️ Supprimer
                    </button>

                </div>

            </div>

        `;

    });


    updateStats();

}


/* =====================================
   CHANGER STATUT
===================================== */

function changeStatus(id,status){

    const order =
        orders.find(
            o => o.id === id
        );


    if(!order){
        return;
    }


    order.status = status;


    localStorage.setItem(
        "electroOrders",
        JSON.stringify(orders)
    );


    displayOrders();

}


/* =====================================
   SUPPRIMER COMMANDE
===================================== */

function deleteOrder(id){

    if(
        !confirm(
            "Supprimer cette commande ?"
        )
    ){

        return;
    }


    orders =
        orders.filter(
            o => o.id !== id
        );


    localStorage.setItem(
        "electroOrders",
        JSON.stringify(orders)
    );


    displayOrders();

}


/* =====================================
   STATISTIQUES
===================================== */

function updateStats(){

    const validOrders =
        orders.filter(
            o => o.status !== "Annulée"
        );


    const sales =
        validOrders.reduce(
            (sum,order) =>
            sum + Number(order.total),
            0
        );


    const productsSold =
        validOrders.reduce(

            (sum,order) =>

            sum +
            order.products.reduce(

                (total,product) =>
                total +
                Number(product.quantity),

                0
            ),

            0
        );


    document.getElementById(
        "sales"
    ).textContent = sales;


    document.getElementById(
        "ordersCount"
    ).textContent =
        orders.length;


    document.getElementById(
        "productsSold"
    ).textContent =
        productsSold;

}


/* =====================================
   BOUTIQUE
===================================== */

function goStore(){

    window.location.href =
        "index.html";

}


/* =====================================
   START
===================================== */

displayProducts();

displayOrders();

updateStats();

</script>

</body>
</html>
