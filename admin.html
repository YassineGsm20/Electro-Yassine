<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const supabaseUrl = 'https://nvimuhzejyauoriupkot.supabase.co';
    const supabaseKey = 'sb_publishable_27i9MDfLKt8i-lWiiROvDA_CfF_yRvS';
    const supabase = createClient(supabaseUrl, supabaseKey);

    window.supabase = supabase;

    let products = [];
    window.editingId = null; // Rendu global pour que le formulaire y accède partout

    async function fetchProducts() {
        const { data, error } = await supabase.from('products').select('*');
        if (error) {
            console.error('خطأ في جلب المنتجات:', error);
        } else {
            products = data || [];
            displayProducts();
        }
    }

    window.previewImage = function() {
        const file = document.getElementById("productImage").files[0];
        if(!file) return;

        const reader = new FileReader();
        reader.onload = function(e){
            const preview = document.getElementById("imagePreview");
            preview.src = e.target.result;
            preview.style.display = "block";
        };
        reader.readAsDataURL(file);
    }

    window.saveProduct = async function() {
        const name = document.getElementById("productName").value.trim();
        const price = Number(document.getElementById("productPrice").value);
        const fileInput = document.getElementById("productImage");
        const file = fileInput.files[0];

        if(!name){
            alert("❌ Entre le nom du produit.");
            return;
        }

        if(!price || price <= 0){
            alert("❌ Entre un prix valide.");
            return;
        }

        // Vérification sécurisée avec window.editingId
        if(window.editingId === null && !file){
            alert("❌ Choisis une photo du produit.");
            return;
        }

        let imageUrl = null;

        if(file){
            const fileName = `${Date.now()}-${file.name}`;
            const { data: uploadData, error: uploadError } = await supabase.storage
                .from('products')
                .upload(fileName, file);

            if(uploadError){
                alert("❌ خطأ في رفع الصورة: " + uploadError.message);
                return;
            }

            const { data: { publicUrl } } = supabase.storage
                .from('products')
                .getPublicUrl(fileName);

            imageUrl = publicUrl;
        } else {
            const oldProduct = products.find(p => p.id === window.editingId);
            if(oldProduct) {
                imageUrl = oldProduct.Image;
            }
        }

        if(window.editingId !== null){
            const { error } = await supabase
                .from('products')
                .update({ title: name, price: price, Image: imageUrl })
                .eq('id', window.editingId);

            if(error){
                alert("❌ خطأ أثناء التحديث: " + error.message);
            } else {
                alert("✅ Produit modifié avec succès !");
            }
        } else {
            const { error } = await supabase
                .from('products')
                .insert([{ title: name, price: price, Image: imageUrl }]);

            if(error){
                alert("❌ خطأ أثناء الإضافة: " + error.message);
            } else {
                alert("✅ Produit ajouté avec succès !");
            }
        }

        cancelEdit();
        fetchProducts();
    }

    function displayProducts(){
        const list = document.getElementById("productsList");
        list.innerHTML = "";

        document.getElementById("productsCount").textContent = products.length;

        if(products.length === 0){
            list.innerHTML = `<div class="empty">Aucun produit pour le moment.</div>`;
            return;
        }

        products.forEach(product => {
            list.innerHTML += `
                <div class="admin-product">
                    <img src="${product.Image}" alt="${product.title}">
                    <div class="product-info">
                        <strong>${product.title}</strong>
                        <p>${product.price} DH</p>
                    </div>
                    <button class="edit" onclick="editProduct(${product.id})">✏️ Modifier</button>
                    <button class="delete" onclick="deleteProduct(${product.id})">🗑️ Supprimer</button>
                </div>
            `;
        });
    }

    window.editProduct = function(id){
        const product = products.find(p => p.id === id);
        if(!product) return;

        window.editingId = id; // Utilisation de la variable globale
        document.getElementById("productName").value = product.title;
        document.getElementById("productPrice").value = product.price;

        const preview = document.getElementById("imagePreview");
        preview.src = product.Image;
        preview.style.display = "block";

        document.getElementById("formTitle").textContent = "✏️ Modifier le produit";
        document.getElementById("productImage").value = "";

        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    window.deleteProduct = async function(id){
        if(!confirm("Voulez-vous supprimer ce produit ?")) return;

        const { error } = await supabase
            .from('products')
            .delete()
            .eq('id', id);

        if(error){
            alert("❌ خطأ أثناء الحذف: " + error.message);
        } else {
            fetchProducts();
        }
    }

    window.cancelEdit = function(){
        window.editingId = null; // Réinitialisation globale
        document.getElementById("productName").value = "";
        document.getElementById("productPrice").value = "";
        document.getElementById("productImage").value = "";
        document.getElementById("imagePreview").style.display = "none";
        document.getElementById("formTitle").textContent = "➕ Ajouter un produit";
    }

    window.goStore = function(){
        window.location.href = "index.html";
    }

    fetchProducts();
</script>
